# ====================================================
# NPay plugin — cấu hình mặc định
# Override các giá trị này trong application.properties của Ezyplatform host
# ====================================================

# Xác thực webhook — cấu hình ít nhất một, request hợp lệ khi khớp một trong hai:
#  api-token: API key của webhook trên npay.vn (header Authorization: Apikey <token>)
#  webhook-secret: webhook secret (bật "Ký request"), kiểm X-Npay-Signature = hex HMAC-SHA256 raw body
npay.api-token=
npay.webhook-secret=
npay.webhook-tolerance-seconds=300

# Thông tin tài khoản nhận tiền
npay.account-number=
npay.bank-bin=970422
npay.account-holder=

# Template ảnh QR: qr_only = chỉ mã QR (/qrpay), còn lại = thẻ VietQR (/qrcard)
npay.qr-template=compact

# Endpoints NPay
npay.api-base-url=https://api.npay.vn
npay.qr-base-url=https://qr.npay.vn
npay.merchant-portal=https://npay.vn
